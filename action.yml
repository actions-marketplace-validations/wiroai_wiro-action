name: Wiro AI Action
description: Run any of 1,000+ Wiro AI models for image, video, audio and 3D, or ask an LLM, and use the results in your workflow.
author: Wiro AI

branding:
  icon: zap
  color: gray-dark

inputs:
  api-key:
    description: Your Wiro AI project API key. Keep it in a secret.
    required: true
  api-secret:
    description: The project's API secret, for projects that use signature authentication. Keep it in a secret.
    required: false
    default: ''
  mode:
    description: '`model` runs a model and waits for the task. `workflow` runs one of your Wiro AI workflows. `llm` sends one chat request to the Wiro AI LLM gateway. When empty: `workflow` if `workflow` is set, otherwise `model`.'
    required: false
    default: ''
  model:
    description: 'model and llm modes: the model ID, as `owner/model` from the model page on wiro.ai, for example `pruna/p-image` or `openai/gpt-5-4-mini`.'
    required: false
    default: ''
  workflow:
    description: 'workflow mode: the workflow to run, as its full slug, such as `product-ad-a1B2c`, or its link on wiro.ai.'
    required: false
    default: ''
  prompt:
    description: 'llm mode: the message to send (required). model and workflow modes: sent as the `prompt` parameter or input.'
    required: false
    default: ''
  system:
    description: 'llm mode: the system prompt.'
    required: false
    default: ''
  params:
    description: 'A JSON or YAML mapping. model mode: the model parameters. workflow mode: the workflow inputs. llm mode: extra Chat Completions fields such as `max_tokens` or `reasoning_effort`.'
    required: false
    default: ''
  files:
    description: 'model and workflow modes: a mapping of file parameter or input to local path, for example `inputImage: assets/photo.png`. llm mode: paths or glob patterns, one per line, to attach to the prompt (text files, PNG, JPEG, GIF, WebP and PDF).'
    required: false
    default: ''
  max-cost:
    description: 'The most a run may cost, in USD, for example `0.50`. The action estimates the price first and does not start a run whose estimate is higher, or whose price it cannot confirm under the limit.'
    required: false
    default: ''
  timeout:
    description: Seconds to wait for the result.
    required: false
    default: '600'
  poll-interval:
    description: 'model and workflow modes: seconds between status checks.'
    required: false
    default: '3'
  cancel-on-timeout:
    description: 'model mode: stop the task when `timeout` runs out or the workflow run is cancelled.'
    required: false
    default: 'true'
  download:
    description: 'model and workflow modes: download the output files into `download-dir`.'
    required: false
    default: 'false'
  download-dir:
    description: 'model and workflow modes: the folder for downloaded files, relative to the workspace.'
    required: false
    default: wiro-output
  summary:
    description: Write the result to the job summary.
    required: false
    default: 'true'
  api-url:
    description: The Wiro AI API base URL.
    required: false
    default: https://api.wiro.ai/v1
  llm-url:
    description: The Wiro AI LLM gateway base URL.
    required: false
    default: https://llm.wiro.ai/v1

outputs:
  task-id:
    description: 'model mode: the Wiro AI task ID.'
  run-token:
    description: 'workflow mode: the token of the workflow run. It is masked in the logs.'
  url:
    description: 'model and workflow modes: the URL of the first output file.'
  urls:
    description: 'model and workflow modes: a JSON array with the URLs of all output files.'
  files:
    description: 'model and workflow modes: a JSON array with the downloaded file paths, relative to the workspace.'
  outputs:
    description: "model mode: the task's outputs as a JSON array of objects with `name`, `contenttype`, `size`, `url` and, for LLMs, `content`. workflow mode: a JSON object with each result of the workflow's End node, as a list of files (`name`, `contenttype`, `size`, `url`) and texts (`text`)."
  text:
    description: 'The text answer: the reply in llm mode. In model mode, the answer of an LLM, or the text file a model returns, such as a transcript. In workflow mode, the text results.'
  cost:
    description: The amount billed for the run, in USD.
  estimated-cost:
    description: 'The price estimated before the run, in USD. Empty when it is not known before the run. In llm mode it is an upper estimate.'
  response:
    description: 'llm mode: the full Chat Completions response as JSON.'

runs:
  using: node24
  main: dist/index.js
